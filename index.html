<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>파파지용</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #F5F7F9;
      --ink: #1C2B3A;
      --ink-soft: #55657A;
      --line: #D5DDE6;
      --accent: #2F6B5B;
      --serif: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
      --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121A22;
        --ink: #E6ECF2;
        --ink-soft: #9AA8B8;
        --line: #2C3946;
        --accent: #7CC2AC;
        color-scheme: dark;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 1.0625rem;
      line-height: 1.75;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-underline-offset: 3px; }
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .wrap {
      max-width: 44rem;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .hero { padding: 6rem 0 3rem; }
    .hero h1 {
      font-family: var(--serif);
      font-weight: 700;
      font-size: clamp(2.25rem, 7vw, 3.5rem);
      line-height: 1.3;
      letter-spacing: -0.01em;
      margin: 0 0 1.5rem;
    }

    .contact {
      padding: 2rem 0;
      border-top: 1px solid var(--line);
    }
    .contact dl { display: grid; grid-template-columns: 6rem 1fr; gap: 0.625rem 1rem; margin: 0; }
    .contact dt { color: var(--ink-soft); }
    .contact dd { margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>파파지용</h1>
    </header>

    <main>
      <section class="contact">
        <dl>
          <dt>이메일</dt>
          <dd><a href="mailto:jinneyjung@gmail.com">jinneyjung@gmail.com</a></dd>
        </dl>
      </section>
    </main>
  </div>
</body>
</html>
